name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate BEACON
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Feed health unit tests
        run: npm run test:feed-health

      - name: Briefing log unit tests
        run: npm run test:briefing-log

      - name: Conflict events unit tests
        run: npm run test:conflict-events

      - name: Radiation unit tests
        run: npm run test:radiation

      - name: Port disruptions unit tests
        run: npm run test:port-disruptions

      - name: Situations engine unit tests
        run: npm run test:situations

      - name: Remaining feed unit tests
        run: |
          for t in live-feeds credentialed-feeds hazard-feeds view-hotkeys dashboard-settings \
                   infra-advisory-feeds usgs-gauges fema-disasters tsunami expanded-feeds transport-cable-feeds gdelt-events wiki-surge region-context nasa-imagery weather-layers launches geo-nearby place-watch; do
            echo "::group::test:$t"; npm run "test:$t"; echo "::endgroup::"
          done

      # Build first: it generates .next/types, which the typecheck includes.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Start server
        env:
          PORT: '3011'
        run: |
          npm run start > /tmp/beacon-next.log 2>&1 &
          echo $! > /tmp/beacon-next.pid

      - name: Smoke test
        env:
          BEACON_BASE_URL: http://127.0.0.1:3011
          SMOKE_TIMEOUT_MS: '45000'
        run: npm run smoke

      - name: Print server log on failure
        if: failure()
        run: |
          cat /tmp/beacon-next.log || true

  # Native builds per platform (the Pi is arm64; ubuntu-24.04-arm runners are
  # free for public repos), pushed by digest, then joined into one manifest.
  docker:
    name: Build image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: validate
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/beacon

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/beacon,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Publish multi-arch image
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/beacon
          tags: |
            type=raw,value=latest
            type=sha

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/beacon@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/beacon:latest
