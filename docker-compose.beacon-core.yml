name: beacon

services:
  beacon:
    image: ghcr.io/andrewleaman-stack/beacon:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beacon
    ports:
      - "${BEACON_PORT:-3011}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_OPTIONS: --dns-result-order=ipv4first
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      # Persist the AI briefing backlog to the mounted volume below (survives
      # container restarts). The host dir must be writable by the container
      # user (uid 1001) — see docs/deploy/beacon-core.md.
      BEACON_BRIEF_LOG_DIR: /var/log/beacon_briefs
    volumes:
      - ./beacon_briefs:/var/log/beacon_briefs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.mjs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    restart: unless-stopped

  # Entity-graph lookups (sanctions, Wikidata, IP registries). Internal only: the
  # beacon container reaches it at http://beacon-intel:4000; no port is published.
  beacon-intel:
    image: ghcr.io/andrewleaman-stack/beacon-intel:latest
    build:
      context: ./intel
      dockerfile: Dockerfile
    container_name: beacon-intel
    # Parsing the OFAC sanctions list peaks around 320 MB, then ~180 MB of heap at rest.
    environment:
      NODE_OPTIONS: --dns-result-order=ipv4first --max-old-space-size=384
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
